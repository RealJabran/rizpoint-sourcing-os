foreground = yes
pid =
debug = notice
output = /dev/stderr

[rizpoint-web-mtls]
accept = 0.0.0.0:3443
connect = 127.0.0.1:3000
cert = /run/secrets/rizpoint_web_server_cert
key = /run/secrets/rizpoint_web_server_key
CAfile = /run/secrets/rizpoint_internal_ca
verifyChain = yes
checkHost = edge
sslVersionMin = TLSv1.2
options = NO_SSLv2
options = NO_SSLv3
options = NO_TLSv1
options = NO_TLSv1.1
