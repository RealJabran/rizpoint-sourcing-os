pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log /dev/stdout combined;
  error_log /dev/stderr warn;
  client_max_body_size 2m;

  # The supported profile publishes only 8443 as host TCP/443. This listener
  # exists for a managed edge that forwards HTTP to the container solely for a
  # redirect; it is deliberately not host-published by Compose.
  server {
    listen 8080 default_server;
    return 308 https://$host$request_uri;
  }

  server {
    listen 8443 ssl default_server;
    ssl_certificate /run/secrets/rizpoint_tls_cert;
    ssl_certificate_key /run/secrets/rizpoint_tls_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Amazon Information remains encrypted after the public TLS boundary.
    # The web-side stunnel terminates this mutually authenticated hop and only
    # forwards over loopback inside the web container.
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_ssl_trusted_certificate /run/secrets/rizpoint_internal_ca;
    proxy_ssl_certificate /run/secrets/rizpoint_edge_client_cert;
    proxy_ssl_certificate_key /run/secrets/rizpoint_edge_client_key;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 2;
    proxy_ssl_server_name on;
    proxy_ssl_name web;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
      proxy_pass https://web:3443;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Port 443;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_hide_header Strict-Transport-Security;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
    }
  }
}
