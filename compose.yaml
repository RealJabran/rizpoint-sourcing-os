services:
  postgres:
    image: postgres:17.8-alpine3.22
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8.4.0-alpine3.22
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD
        mc mb --ignore-existing local/$$S3_BUCKET
        mc anonymous set none local/$$S3_BUCKET
        tail -f /dev/null
    healthcheck:
      test: ["CMD-SHELL", "mc stat local/$$S3_BUCKET"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    command: ["pnpm", "--filter", "@rizpoint/database", "prisma:deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  scanner:
    build:
      context: services/scanner
      dockerfile: Dockerfile
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      MALWARE_SCAN_MODE: clamav
      CLAMAV_HOST: clamav
    depends_on:
      clamav:
        condition: service_healthy

  clamav:
    image: clamav/clamav:1.4
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --version"]
      interval: 10s
      timeout: 5s
      retries: 30

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      SCANNER_BASE_URL: http://scanner:8000
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_SERVER_SIDE_ENCRYPTION: ${S3_SERVER_SIDE_ENCRYPTION:-}
      S3_KMS_KEY_ID: ${S3_KMS_KEY_ID:-}
      S3_VERSIONING_ENABLED: ${S3_VERSIONING_ENABLED:-false}
      S3_LIFECYCLE_MANAGED: ${S3_LIFECYCLE_MANAGED:-false}
      PROVIDER_MODE: ${PROVIDER_MODE:-mock}
      SP_API_LWA_CLIENT_ID: ${SP_API_LWA_CLIENT_ID}
      SP_API_LWA_CLIENT_SECRET: ${SP_API_LWA_CLIENT_SECRET}
      PROVIDER_CREDENTIAL_KEY_V1: ${PROVIDER_CREDENTIAL_KEY_V1}
      SP_API_ENDPOINT: ${SP_API_ENDPOINT}
      RIZPOINT_RELEASE_SHA: ${RIZPOINT_RELEASE_SHA:-development}
      RIZPOINT_ERROR_TRACKING_WEBHOOK_URL: ${RIZPOINT_ERROR_TRACKING_WEBHOOK_URL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      scanner:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      SCANNER_BASE_URL: http://scanner:8000
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_SERVER_SIDE_ENCRYPTION: ${S3_SERVER_SIDE_ENCRYPTION:-}
      S3_KMS_KEY_ID: ${S3_KMS_KEY_ID:-}
      S3_VERSIONING_ENABLED: ${S3_VERSIONING_ENABLED:-false}
      S3_LIFECYCLE_MANAGED: ${S3_LIFECYCLE_MANAGED:-false}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      RIZPOINT_PRIVATE_ORGANIZATION_SLUG: ${RIZPOINT_PRIVATE_ORGANIZATION_SLUG}
      RIZPOINT_RELEASE_SHA: ${RIZPOINT_RELEASE_SHA:-development}
      PROVIDER_MODE: ${PROVIDER_MODE:-mock}
      SP_API_LWA_CLIENT_ID: ${SP_API_LWA_CLIENT_ID}
      SP_API_LWA_CLIENT_SECRET: ${SP_API_LWA_CLIENT_SECRET}
      PROVIDER_CREDENTIAL_KEY_V1: ${PROVIDER_CREDENTIAL_KEY_V1}
      SP_API_ENDPOINT: ${SP_API_ENDPOINT}
      PHASE_ZERO_DEMO_MODE: "true"
      RIZPOINT_ALLOW_UNAUTHENTICATED_DEMO: "true"
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      worker:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  minio-data:
