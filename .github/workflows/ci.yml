name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:private-assets
      - run: pnpm check:production-hardening
      - run: DATABASE_URL=postgresql://invalid:invalid@127.0.0.1:1/invalid pnpm db:generate
      - run: pnpm verify
      - run: pnpm release-gate:research
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e 'services/scanner[dev]'
      - run: python -m ruff check services/scanner && python -m ruff format --check services/scanner
      - run: cd services/scanner && python -m mypy --config-file pyproject.toml
      - run: cd services/scanner && python -m pytest -q tests

  compose-integration:
    runs-on: ubuntu-latest
    needs: native
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: docker compose up --build --wait
      - run: pnpm test:integration
      - run: pnpm test:scale
      - run: pnpm test:browser
      - run: pnpm test:scale:browser
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
