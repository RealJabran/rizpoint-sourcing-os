packages:
  - apps/*
  - packages/*

allowBuilds:
  "@prisma/engines": true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - bullmq@5.80.2
  - "@tanstack/react-virtual@3.14.6"
  - "@tanstack/virtual-core@3.17.4"

overrides:
  deepmerge-ts: 8.0.0
  fast-uri: 3.1.5
  nanoid: 3.3.18
  postcss: 8.5.23
  sharp: 0.35.0
